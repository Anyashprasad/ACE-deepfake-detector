name: CI

on: [push, pull_request]

jobs:
  ace-edge-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas pillow numpy scikit-learn
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s review/tests -v
      - run: python -m compileall -q ace_edge kaggle_entry.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ace-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
