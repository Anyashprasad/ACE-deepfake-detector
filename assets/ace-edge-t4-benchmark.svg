<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">Dual-T4 fixed-work speedup benchmark</title><desc id="desc">The gate was 1.35 times and the measured median speedup was 1.8437 times with a 95 percent confidence interval from 1.8396 to 1.8458.</desc>
  <rect width="960" height="310" rx="24" fill="#0b1220"/><text x="54" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Dual-T4 fixed-work speedup</text><text x="54" y="92" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14">10 fresh counterbalanced repetitions · higher is better</text>
  <line x1="86" y1="213" x2="894" y2="213" stroke="#475569" stroke-width="2"/><g stroke="#334155"><line x1="86" y1="205" x2="86" y2="221"/><line x1="490" y1="205" x2="490" y2="221"/><line x1="894" y1="205" x2="894" y2="221"/></g><g fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13"><text x="80" y="245">1.0×</text><text x="479" y="245">1.5×</text><text x="882" y="245">2.0×</text></g>
  <line x1="369" y1="124" x2="369" y2="213" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6"/><text x="369" y="116" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="middle">1.35× gate</text>
  <line x1="764" y1="158" x2="769" y2="158" stroke="#5eead4" stroke-width="12" stroke-linecap="round"/><circle cx="768" cy="158" r="13" fill="#14b8a6" stroke="#ccfbf1" stroke-width="3"/><text x="768" y="139" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle">1.8437×</text><text x="768" y="188" fill="#99f6e4" font-family="Inter,Segoe UI,sans-serif" font-size="13" text-anchor="middle">95% CI 1.8396–1.8458</text>
  <text x="54" y="282" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="12">Measured on exactly two NVIDIA T4 GPUs; this is throughput evidence, not accuracy evidence.</text>
</svg>
